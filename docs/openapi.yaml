openapi: 3.0.3
info:
  title: Odoo 19 Custom Modules & API Ecosystem
  description: Public documentation for custom Odoo 19 modules, REST APIs, and external integration webhooks.
  version: 1.0.0
servers:
  - url: http://localhost:8069
    description: Local Development Server

tags:
  - name: Core API Connector
    description: REST API endpoints for CRM, Catalog, and Sales
  - name: Payment Gateway Ukraine
    description: Webhook controllers and integration for Monobank and LiqPay payments
  - name: Delivery & Logistics
    description: Nova Poshta shipping labels and tracking integrations
  - name: Notifications
    description: Telegram bot notifications and alert routing
  - name: Telephony Connector
    description: IP-PBX incoming call webhooks and CRM automation
  - name: Marketplace & Stock Sync
    description: Stock level synchronization and external order import

paths:
  /api/v1/ping:
    get:
      tags:
        - Core API Connector
      summary: Healthcheck endpoint
      responses:
        '200':
          description: Service is active

  /api/v1/lead/create:
    post:
      tags:
        - Core API Connector
      summary: Create CRM Lead
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Client Name
              phone: '+380501112233'
              email: client@example.com
              description: Interested in services
      responses:
        '201':
          description: Lead created

  /api/v1/products:
    get:
      tags:
        - Core API Connector
      summary: Fetch Product Catalog
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Product list returned

  /api/v1/sale_order/create:
    post:
      tags:
        - Core API Connector
      summary: Create Sale Order
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              customer:
                name: Dmytro Petrenko
                phone: '+380971112233'
                email: dmytro@example.com
              items:
                - product_id: 5
                  qty: 1
      responses:
        '201':
          description: Sale Order created

  /api/v1/sale_order/{order_id}:
    get:
      tags:
        - Core API Connector
      summary: Get Sale Order Details & Status
      security:
        - ApiKeyAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details returned

  /api/v1/sale_order/confirm:
    post:
      tags:
        - Core API Connector
      summary: Confirm Sale Order (Quotation -> Sales Order)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              order_id: 26
      responses:
        '200':
          description: Order confirmed

  /payment/monobank/webhook:
    post:
      tags:
        - Payment Gateway Ukraine
      summary: Monobank status webhook callback
      description: Handles payment status updates from Monobank via JSON-RPC 2.0 protocol and updates Sale Order state.
      parameters:
        - name: X-Token
          in: header
          required: true
          description: Secret API Token configured in Odoo Settings
          schema:
            type: string
            example: my_custom_mono_secret_token
      requestBody:
        required: true
        content:
          application/json:
            example:
              jsonrpc: "2.0"
              method: "call"
              params:
                order_reference: "S00029"
                invoiceId: "mono_tx_55555"
                status: "success"
              id: 1
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  status: "ok"
                  order_id: 29
                  order_status: "sale"

  /payment/liqpay/webhook:
    post:
      tags:
        - Payment Gateway Ukraine
      summary: LiqPay status webhook callback
      description: Process status callback from LiqPay with base64 data and SHA1 signature verification.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: Base64 encoded JSON string with payment parameters
                signature:
                  type: string
                  description: Base64 encoded SHA1 signature
              required:
                - data
                - signature
      responses:
        '200':
          description: LiqPay notification acknowledged (OK)

  /telephony/webhook/event:
    post:
      tags:
        - Telephony Connector
      summary: Process incoming IP-PBX call event
      parameters:
        - name: X-Odoo-Database
          in: header
          required: false
          schema:
            type: string
            example: odoo_dev
      requestBody:
        required: true
        content:
          application/json:
            example:
              jsonrpc: "2.0"
              params:
                external_call_id: "TEL-998812"
                phone: "+380671112233"
                call_type: "missed"
                duration: 0
      responses:
        '200':
          description: Call logged and CRM lead created (if missed)

  /marketplace/webhook/order:
    post:
      tags:
        - Marketplace & Stock Sync
      summary: Receive external order from Prom/Rozetka
      parameters:
        - name: X-Odoo-Database
          in: header
          required: false
          schema:
            type: string
            example: odoo_dev
      requestBody:
        required: true
        content:
          application/json:
            example:
              jsonrpc: "2.0"
              params:
                sku: "PROM-ITEM-101"
                quantity: 2
                customer_name: "Ivan Petrenko"
                phone: "+380679998877"
      responses:
        '200':
          description: Sale order successfully created in Odoo

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY